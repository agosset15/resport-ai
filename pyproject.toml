[project]
name = "resport-ai"
version = "0.1.0"
description = "ReSport AI — Telegram-бот первичной сортировки спортивных травм и трекер восстановления"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram>=3.15",
    "alembic>=1.14",
    "apscheduler>=3.11",
    "asyncpg>=0.30",
    "dishka>=1.4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "orjson>=3.10",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: требует поднятую Postgres (пропускается, если БД недоступна)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "ASYNC", "RUF"]
# RUF001-003: проект русскоязычный, кириллица в строках и докстрингах — норма.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
