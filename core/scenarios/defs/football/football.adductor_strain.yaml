  # Д: новый неясный эпизод, все ответы — Н → только краткое наблюдение 48–72 ч
  - when:
      all:
      - {g_age: adult}
      - g_prior_eval: [previous_only, not_evaluated]
      - g_age: [adult, minor]
      - any:
