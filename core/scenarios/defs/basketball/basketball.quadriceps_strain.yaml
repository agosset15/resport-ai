  # Д: диагноз этого эпизода есть, программа назначена специалистом, все ответы — Н
  - when:
      all:
      - {g_prior_eval: this_episode}
      - {g_program: ready}
      - g_age: [adult, minor]
      - any:
        - not: {g_age: minor}
        - g_adult: [adult_involved]
      - g_trend: [improving]
      - g_deformity: [absent]
      - g_circulation: [absent]
      - g_pain_swelling: [mild_decreasing]
      - g_hot_joint: [absent]
      - g_dvt: [absent]
