  - {default: true, outcome: refer_specialist, reason_code: default_referral}

plans:
  quadriceps_strain_prescribed:
    title: Восстановление по программе специалиста
    completion_text: |
      Контрольный период по программе пройден. Это не допуск к соревнованиям:
      возврат к прыжкам, спринтам, сменам направления, ударам и контакту оценивает
      специалист отдельно, в согласованный с ним срок.
    stages:
    - key: prescribed
      title: Программа специалиста
      days: 14
      description: Выполняем то, что назначил специалист, и следим за реакцией на нагрузку.
      tasks:
      - {key: do_program, text: 'Выполнить упражнения из назначенной программы — в назначенной дозировке, не больше'}
      - {key: respect_limits, text: 'Соблюдать ограничения, которые назвал специалист'}
      - {key: morning_check, text: 'Утром следующего дня отметить боль (0–10), отёк и как даются ходьба и сгибание колена'}
      - {key: no_progression, text: Если к утру стало хуже — нагрузку не повышать}
      advance_if: {feeling: better, consecutive: 3, tasks_done_ratio_gte: 0.7}
      escalate_if: {feeling: worse, consecutive: 2}
  quadriceps_strain_observation:
    title: Наблюдение 48–72 часа после травмы передней поверхности бедра
    completion_text: |
      Улучшение есть — но это не допуск к тренировкам. Удар по мячу, спринт
      и прыжки оценивают отдельно; для программы восстановления нужен установленный
      диагноз — покажись специалисту. Если появилось уплотнение или колено снова
      сгибается хуже — нужен очный осмотр.
    stages:
    - key: observation
      title: Наблюдение
      days: 3
      description: Бытовая активность в комфортных пределах и ежедневная повторная оценка.
      tasks:
      - {key: comfort_activity, text: 'Обычная ходьба и бытовые дела в комфортных пределах — без ударов по мячу, спринта и прыжков'}
      - {key: no_massage_stretch, text: 'Не делать глубокий массаж ушиба и силовую растяжку, не проверять силу удара'}
      - {key: morning_check, text: 'Утром отметить боль (0–10), напряжение бедра и насколько сгибается колено'}
      advance_if: {feeling: better, consecutive: 2, min_days: 2}
      escalate_if:
        feeling: [same, worse]
        consecutive: 2

texts:
  refer_specialist: |
    По твоим ответам нужен очный осмотр — самостоятельное восстановление сейчас
    небезопасно. Это не диагноз.
    Если конечность сильно изменила форму, стала холодной, бледной или синюшной,
    боль резко нарастает, есть одышка или боль в груди — вызывай экстренную помощь.
    Если не получается нормально разгибать колено и наступать на ногу — в травмпункт сегодня.
    В остальных случаях — плановый осмотр в ближайшие дни.
    До осмотра — без тренировок. Не проверяй травму прыжками, нажатием или растяжкой
    и не пытайся ничего вправлять.
  recovery_plan_intro: |
    Тревожных признаков в ответах нет. Это не диагноз и не допуск к тренировкам.
    Дальше — короткий план: каждый день отмечаешь задачи и самочувствие.
    Если станет хуже или появится новый тревожный признак — сразу напиши,
    я предложу обратиться к врачу.
  escalation: |
    Самочувствие не улучшается два чек-ина подряд — дальше по плану не идём,
    нужен очный осмотр. Если появились деформация, онемение, холодная или синюшная
    кожа либо резко нарастающая боль — вызывай экстренную помощь.
