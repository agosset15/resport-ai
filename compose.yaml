name: resport

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-resport}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-resport}
      POSTGRES_DB: ${DB_NAME:-resport}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-resport} -d ${DB_NAME:-resport}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["uv", "run", "python", "-m", "apps.api"]
    env_file: [.env]
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    command: ["uv", "run", "python", "-m", "apps.worker"]
    env_file: [.env]
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  metabase:
    image: metabase/metabase:latest
    profiles: ["analytics"]
    ports:
      - "3000:3000"
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
